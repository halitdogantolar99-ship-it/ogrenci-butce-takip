<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Bütçe ve Harcama Takipçisi</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .summary-grid { display: flex; gap: 15px; justify-content: space-between; text-align: center; }
        .summary-box { flex: 1; padding: 15px; border-radius: 6px; background-color: #ecf0f1; }
        .summary-box h4 { margin: 0 0 8px 0; color: #7f8c8d; font-size: 14px; }
        .summary-box p { margin: 0; font-size: 20px; font-weight: bold; color: #2c3e50; }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-header h3 { margin: 0; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input { flex: 1; }
        button { background-color: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .btn-budget { background-color: #3498db; }
        .btn-budget:hover { background-color: #2980b9; }
        .btn-delete { background-color: #e74c3c; padding: 6px 12px; font-size: 13px; }
        .btn-delete:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
    </style>
</head>
<body>

    <h1>Öğrenci Bütçe ve Harcama Takipçisi</h1>

    <!-- Bütçe Tanımlama ve Özet Bölümü -->
    <div class="card">
        <h3>Aylık Bütçe Durumu</h3>
        <div class="form-group">
            <input type="number" id="budget-input" placeholder="Aylık bütçenizi girin (TL)">
            <button class="btn-budget" onclick="setBudget()">Bütçeyi Kaydet</button>
        </div>
        <div class="summary-grid">
            <div class="summary-box">
                <h4>Toplam Bütçe</h4>
                <p id="total-budget">0.00 ₺</p>
            </div>
            <div class="summary-box">
                <h4>Toplam Harcama</h4>
                <p id="total-spent">0.00 ₺</p>
            </div>
            <div class="summary-box">
                <h4>Kalan Bakiye</h4>
                <p id="remaining-balance">0.00 ₺</p>
            </div>
        </div>
    </div>

    <!-- Harcama Ekleme Bölümü -->
    <div class="card">
        <h3>Yeni Harcama Ekle</h3>
        <div class="form-group">
            <input type="text" id="desc" placeholder="Harcama açıklaması (Örn: Öğle yemeği)">
            <input type="number" id="amount" placeholder="Tutar (TL)">
            <select id="category">
                <option value="Yemek">Yemek</option>
                <option value="Ulaşım">Ulaşım</option>
                <option value="Kırtasiye">Kırtasiye</option>
                <option value="Diğer">Diğer</option>
            </select>
            <button onclick="addExpense()">Ekle</button>
        </div>
    </div>

    <!-- Harcama Listesi ve Filtreleme Bölümü -->
    <div class="card">
        <div class="list-header">
            <h3>Harcama Listesi</h3>
            <select id="filter-category" onchange="renderExpenses()">
                <option value="Tümü">Tüm Kategoriler</option>
                <option value="Yemek">Yemek</option>
                <option value="Ulaşım">Ulaşım</option>
                <option value="Kırtasiye">Kırtasiye</option>
                <option value="Diğer">Diğer</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Açıklama</th>
                    <th>Kategori</th>
                    <th>Tutar (TL)</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="expense-list"></tbody>
        </table>
    </div>

    <script>
        let totalBudget = parseFloat(localStorage.getItem('studentBudget')) || 0;
        let expenses = JSON.parse(localStorage.getItem('studentExpenses')) || [];

        function saveToStorage() {
            localStorage.setItem('studentBudget', totalBudget.toString());
            localStorage.setItem('studentExpenses', JSON.stringify(expenses));
        }

        function setBudget() {
            const val = parseFloat(document.getElementById('budget-input').value);
            if (isNaN(val) || val < 0) {
                alert("Lütfen geçerli bir bütçe tutarı giriniz.");
                return;
            }
            totalBudget = val;
            document.getElementById('budget-input').value = '';
            saveToStorage();
            updateSummary();
        }

        function addExpense() {
            const desc = document.getElementById('desc').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;

            if (!desc || isNaN(amount) || amount <= 0) {
                alert("Lütfen geçerli bir açıklama ve tutar giriniz.");
                return;
            }

            expenses.push({ id: Date.now(), desc, amount, category });
            saveToStorage();
            renderExpenses();
            updateSummary();

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        }

        function deleteExpense(id) {
            expenses = expenses.filter(item => item.id !== id);
            saveToStorage();
            renderExpenses();
            updateSummary();
        }

        function updateSummary() {
            const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);
            const remaining = totalBudget - totalSpent;

            document.getElementById('total-budget').textContent = totalBudget.toFixed(2) + ' ₺';
            document.getElementById('total-spent').textContent = totalSpent.toFixed(2) + ' ₺';

            const remainingEl = document.getElementById('remaining-balance');
            remainingEl.textContent = remaining.toFixed(2) + ' ₺';
            remainingEl.style.color = remaining < 0 ? '#e74c3c' : '#27ae60';
        }

        function renderExpenses() {
            const list = document.getElementById('expense-list');
            const selectedFilter = document.getElementById('filter-category').value;
            list.innerHTML = '';

            const filteredExpenses = selectedFilter === 'Tümü'
                ? expenses
                : expenses.filter(item => item.category === selectedFilter);

            filteredExpenses.forEach(item => {
                const row = `<tr>
                    <td>${item.desc}</td>
                    <td>${item.category}</td>
                    <td>${item.amount.toFixed(2)} ₺</td>
                    <td><button class="btn-delete" onclick="deleteExpense(${item.id})">Sil</button></td>
                </tr>`;
                list.innerHTML += row;
            });
        }

        updateSummary();
        renderExpenses();
    </script>
</body>
</html>
